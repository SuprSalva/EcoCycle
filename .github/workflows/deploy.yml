name: Deploy a VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configurar SSH hacia el VPS
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

      - name: Desplegar en el VPS
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "
            set -e
            cd /var/ecocycle/EcoCycle

            echo '>> Pull de la rama main'
            git fetch origin main
            git reset --hard origin/main

            echo '>> Rebuild + up de Docker'
            docker-compose up -d --build

            echo '>> Recargando nginx'
            sudo systemctl restart nginx

            echo '>> Deploy OK'
          "