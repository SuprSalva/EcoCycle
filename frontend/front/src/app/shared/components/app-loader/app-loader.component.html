<div class="loader-overlay fade-in-fast" *ngIf="isLoading$ | async">
  <div class="loader-content">
    <div class="logo-container pulse-animation">
      <img src="bottles_only.svg" alt="EcoCycle Logo" class="loader-logo">
    </div>
    <div class="loader-text mt-4">
      <h5 class="fw-bold m-0" style="color: var(--primary-color);">{{ message$ | async }}</h5>
      <p class="text-muted small m-0 mt-1">Por favor espera un momento...</p>
    </div>
    <div class="loading-bar mt-3">
      <div class="loading-bar-progress"></div>
    </div>
  </div>
</div>
