<!-- sidebar.component.html -->
<aside class="sidebar" [class.collapsed]="isCollapsed">

  <div class="sidebar-header">
    <div class="logo-seccion">
      <img src="/logoo_blanco.png" alt="EcoCycle Logo">
      <div class="logo-text">
        <h2>EcoCycle</h2>
        <span>Panel</span>
      </div>
    </div>
    

    <button class="menu-btn" type="button" (click)="toggleSidebar()" aria-label="Toggle sidebar">
      <i class="fa-solid fa-bars"></i>
      <span class="sr-only">Abrir menú</span>
    </button>
  </div>

  <div class="search-box">
    <i class="fa-solid fa-magnifying-glass"></i>
    <input type="text" placeholder="Buscar" [(ngModel)]="searchTerm">
  </div>

  <nav class="menu-navegacion">
    <ng-container *ngFor="let group of filteredMenu">
      <div class="menu-section mt-3">{{ group.section }}</div>
      
      <a *ngFor="let item of group.items" 
         [routerLink]="item.route"
         class="item-menu"
         routerLinkActive="activo">
        <i [class]="item.icon"></i>
        <span>{{ item.name }}</span>
      </a>
    </ng-container>

    <div *ngIf="filteredMenu.length === 0" class="text-center py-4 px-3 text-muted">
      <i class="fa-solid fa-ghost fs-3 mb-2" style="opacity: 0.3;"></i>
      <p class="small mb-0">No se encontraron resultados para "{{ searchTerm }}"</p>
    </div>
  </nav>

  <div class="sidebar-bottom">

    <div class="usuario"
         *ngIf="perfil"
         (click)="toggleUserMenu($event)">
  
      <div class="avatar position-relative" style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; overflow: hidden; border-radius: 50%; margin-right: 10px;">
        <ng-container *ngIf="perfil?.avatarUrl; else avatarPorDefecto">
          <img [src]="perfil.avatarUrl" alt="Avatar" class="w-100 h-100 object-fit-cover m-0">
        </ng-container>
        <ng-template #avatarPorDefecto>
          <a class="btn-theme-toggle">
            <i class="fa-solid fa-user"></i>
        </a>
        </ng-template>
      </div>
  
      <div class="user-info">
        <strong>{{ perfil.nombre || 'Eco Admin' }}</strong>
        <span>{{ perfil.correo || 'admin@ecocycle.com' }}</span>
      </div>
  
      <i class="fa-solid fa-chevron-right"></i>
  
    </div>

    <div class="user-dropdown" *ngIf="showUserMenu" (click)="$event.stopPropagation()">
   
      <button class="dropdown-item" routerLink='/admin/mi-perfil/perfil'>
        <i class="fa-solid fa-user" ></i>
        Perfil
      </button>
  
      <button class="dropdown-item" routerLink='/admin/configuracion'>
        <i class="fa-solid fa-gear"></i>
        Configuración
      </button>
  
      <button class="dropdown-item" routerLink='/admin/quejas'>
        <i class="fa-solid fa-circle-question"></i>
        Buzón de Quejas
      </button>

      <hr>
  
      <button class="dropdown-item danger" (click)="onLogout()">
        <i class="fa-solid fa-right-from-bracket"></i>
        Cerrar sesión
      </button>
  
    </div>
  
  </div>

</aside>
