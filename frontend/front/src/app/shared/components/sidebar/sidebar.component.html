<aside class="sidebar" [class.collapsed]="isCollapsed">

  <div class="sidebar-header">
    <div class="logo-seccion">
      <img src="/logofinalpng.png" alt="EcoCycle Logo">
      <div class="logo-text">
        <h2>EcoCycle</h2>
        <span>Panel</span>
      </div>
    </div>
    <button class="menu-btn" type="button" (click)="toggleSidebar()" aria-label="Toggle sidebar">
      <i class="fa-solid fa-bars"></i>
      <span class="sr-only">Abrir menú</span>
    </button>
  </div>

  <div class="search-box">
    <i class="fa-solid fa-magnifying-glass"></i>
    <input type="text" placeholder="Buscar" [(ngModel)]="searchTerm">
  </div>

  <nav class="menu-navegacion">
    <ng-container *ngFor="let group of filteredMenu">
      <div class="menu-section mt-3">{{ group.section }}</div>
      
      <a *ngFor="let item of group.items" 
         [routerLink]="item.route"
         class="item-menu"
         routerLinkActive="activo">
        <i [class]="item.icon"></i>
        <span>{{ item.name }}</span>
      </a>
    </ng-container>

    <div *ngIf="filteredMenu.length === 0" class="text-center py-4 px-3 text-muted">
      <i class="fa-solid fa-ghost fs-3 mb-2" style="opacity: 0.3;"></i>
      <p class="small mb-0">No se encontraron resultados para "{{ searchTerm }}"</p>
    </div>
  </nav>

  <!-- Parte inferior -->
  <div class="sidebar-bottom">

    <a class="item-menu">
      <i class="fa-solid fa-circle-question"></i>
      <span>Soporte</span>
    </a>

    <a class="item-menu">
      <i class="fa-solid fa-gear"></i>
      <span>Configuración</span>
    </a>

    <div class="usuario" *ngIf="perfil">
      <img src="/usuario.png">
      <div>
        <strong>{{ perfil.nombre || 'Eco Admin' }}</strong>
        <span>{{ perfil.correo || 'admin@ecocycle.com' }}</span>
      </div>
      <i class="fa-solid fa-ellipsis-vertical"></i>
    </div>

  </div>

</aside>
