<!-- sidebar.component.html -->
<aside class="sidebar" [class.collapsed]="isCollapsed">

  <div class="sidebar-header">
    <div class="logo-seccion">
      <img src="/logos.png" alt="EcoCycle Logo">
      <div class="logo-text">
        <h2>EcoCycle</h2>
        <span>Panel</span>
      </div>
    </div>
    <button class="menu-btn" type="button" (click)="toggleSidebar()" aria-label="Toggle sidebar">
      <i class="fa-solid fa-bars"></i>
      <span class="sr-only">Abrir menú</span>
    </button>
  </div>

  <div class="search-box">
    <i class="fa-solid fa-magnifying-glass"></i>
    <input type="text" placeholder="Buscar">
  </div>

  <nav class="menu-navegacion">

    <div class="menu-section">Principal</div>

    <!-- ✅ RUTAS CORREGIDAS -->
    <a routerLink="/admin/dashboard"
       class="item-menu"
       routerLinkActive="activo">
      <i class="fa-solid fa-house"></i>
      <span>Dashboard</span>
    </a>

    <a routerLink="/admin/usuarios"
       class="item-menu"
       routerLinkActive="activo">
      <i class="fa-solid fa-users"></i>
      <span>Usuarios</span>
    </a>

    <div class="menu-section mt-3">Operaciones</div>

    <a routerLink="/admin/reciclaje"
       class="item-menu"
       routerLinkActive="activo">
      <i class="fa-solid fa-cube"></i>
      <span>Terminal IoT</span>
    </a>

    <a routerLink="/admin/catalogo"
       class="item-menu"
       routerLinkActive="activo">
      <i class="fa-solid fa-box"></i>
      <span>Catálogo</span>
    </a>

    <a routerLink="/admin/historial-recompensas"
       class="item-menu"
       routerLinkActive="activo">
      <i class="fa-solid fa-layer-group"></i>
      <span>Recompensas</span>
    </a>

    <div class="menu-section mt-3">Abastecimiento</div>

    <a routerLink="/admin/proveedores"
       class="item-menu"
       routerLinkActive="activo">
      <i class="fa-solid fa-truck"></i>
      <span>Proveedores</span>
    </a>

    <a routerLink="/admin/compras-proveedores"
       class="item-menu"
       routerLinkActive="activo">
      <i class="fa-solid fa-cart-shopping"></i>
      <span>Compras a Proveedores</span>
    </a>

    <a routerLink="/admin/soporte" 
       class="item-menu" 
       routerLinkActive="activo">
      <i class="fa-solid fa-headset"></i> 
      <span>Soporte Técnico</span>
    </a>

    <div class="menu-section mt-3">Análisis</div>

    <a routerLink="/admin/reportes"
       class="item-menu"
       routerLinkActive="activo">
      <i class="fa-solid fa-chart-column"></i>
      <span>Reportes</span>
    </a>

  </nav>

  <div class="sidebar-bottom">

    <a class="item-menu">
      <i class="fa-solid fa-bell"></i>
      <span>Notificaciones</span>
      <small>12</small>
    </a>

    <a class="item-menu">
      <i class="fa-solid fa-circle-question"></i>
      <span>Soporte</span>
    </a>

    <a class="item-menu">
      <i class="fa-solid fa-gear"></i>
      <span>Configuración</span>
    </a>

    <div class="usuario">
      <img src="/usuario.png">
      <div>
        <strong>Eco Admin</strong>
        <span>adminecocycle.com</span>
      </div>
      <i class="fa-solid fa-ellipsis-vertical"></i>
    </div>

  </div>

</aside>
