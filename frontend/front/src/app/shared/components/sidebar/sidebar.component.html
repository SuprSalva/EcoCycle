<aside class="sidebar" [class.collapsed]="isCollapsed">

  <div class="sidebar-header">
    <div class="logo-seccion">
      <img src="/logos.png" alt="EcoCycle Logo">
      <div class="logo-text">
        <h2>EcoCycle</h2>
        <span>Panel</span>
      </div>
    </div>
    
    <button class="btn-theme-toggle" (click)="toggleTheme()" [title]="isLightTheme ? 'Cambiar a Modo Oscuro' : 'Cambiar a Modo Claro'">
      <i class="fa-solid" [ngClass]="isLightTheme ? 'fa-moon' : 'fa-sun'"></i>
    </button>

    <button class="btn-logout" (click)="onLogout()">
      <i class="fa-solid fa-right-from-bracket"></i> Cerrar Sesión
    </button>

    <button class="menu-btn" type="button" (click)="toggleSidebar()" aria-label="Toggle sidebar">
      <i class="fa-solid fa-bars"></i>
      <span class="sr-only">Abrir menú</span>
    </button>
  </div>

  <div class="search-box">
    <i class="fa-solid fa-magnifying-glass"></i>
    <input type="text" placeholder="Buscar">
  </div>

  <nav class="menu-navegacion">

    <div class="menu-section">Principal</div>

    <a routerLink="/panel/dashboard"
       class="item-menu"
       routerLinkActive="activo">
      <i class="fa-solid fa-house"></i>
      <span>Dashboard</span>
    </a>

    <a routerLink="/panel/usuarios"
       class="item-menu"
       routerLinkActive="activo">
      <i class="fa-solid fa-users"></i>
      <span>Usuarios</span>
    </a>

    <div class="menu-section mt-3">Operaciones</div>

    <a routerLink="/panel/reciclaje"
       class="item-menu"
       routerLinkActive="activo">
      <i class="fa-solid fa-cube"></i>
      <span>Terminal IoT</span>
    </a>

    <a routerLink="/panel/catalogo"
       class="item-menu"
       routerLinkActive="activo">
      <i class="fa-solid fa-box"></i>
      <span>Catálogo</span>
    </a>

    <a routerLink="/panel/historial-recompensas"
       class="item-menu"
       routerLinkActive="activo">
      <i class="fa-solid fa-layer-group"></i>
      <span>Recompensas</span>
    </a>

    <div class="menu-section mt-3">Abastecimiento</div>

    <a routerLink="/panel/proveedores"
       class="item-menu"
       routerLinkActive="activo">
      <i class="fa-solid fa-truck"></i>
      <span>Proveedores</span>
    </a>

    <a routerLink="/panel/compras-proveedores"
       class="item-menu"
       routerLinkActive="activo">
      <i class="fa-solid fa-cart-shopping"></i>
      <span>Compras a Proveedores</span>
    </a>

    <!-- 🔥 SOPORTE TÉCNICO (tu agregaste) -->
    <a routerLink="/panel/soporte" 
       class="item-menu" 
       routerLinkActive="activo">
      <i class="fa-solid fa-headset"></i> 
      <span>Soporte Técnico</span>
    </a>

    <div class="menu-section mt-3">Análisis</div>

    <a routerLink="/panel/reportes"
       class="item-menu"
       routerLinkActive="activo">
      <i class="fa-solid fa-chart-column"></i>
      <span>Reportes</span>
    </a>

    <a routerLink="/panel/materia-prima"
       class="item-menu"
       routerLinkActive="activo">

      <i class="fa-solid fa-warehouse"></i>
      <span>Materia Prima</span>

    </a>

    <a routerLink="/panel/cliente"
       class="item-menu"
       routerLinkActive="activo">

      <i class="fa-solid fa-user-circle"></i>
      <span>Portal Cliente</span>

    </a>

  </nav>

  <!-- Parte inferior -->
  <div class="sidebar-bottom">

    <a class="item-menu">
      <i class="fa-solid fa-bell"></i>
      <span>Notificaciones</span>
      <small>12</small>
    </a>

    <a class="item-menu">
      <i class="fa-solid fa-circle-question"></i>
      <span>Soporte</span>
    </a>

    <a class="item-menu">
      <i class="fa-solid fa-gear"></i>
      <span>Configuración</span>
    </a>

    <div class="usuario">
      <img src="/usuario.png">
      <div>
        <strong>Eco Admin</strong>
        <span>adminecocycle.com</span>
      </div>
      <i class="fa-solid fa-ellipsis-vertical"></i>
    </div>

  </div>

</aside>
