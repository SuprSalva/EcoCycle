<main class="login-wrapper">
  <div class="background-overlay"></div>

  <section class="login-card">
    
    <div class="login-header">
      <div class="logo-container">
        <img src="/logos.png" alt="EcoCycle" class="logo-img">
        <h1 class="brand-name">EcoCycle</h1>
      </div>
      <p class="subtitle">Sistema de Gestión Sostenible</p>
    </div>

    <form class="login-form" (ngSubmit)="onLogin()">
      
      <div class="input-group">
        <label for="email">Correo Electrónico</label>
        <div class="input-wrapper">
          <i class="fa-regular fa-envelope input-icon"></i>
          <input
            id="email"
            type="email"
            name="email"
            [(ngModel)]="email"
            placeholder="ejemplo@ecocycle.com"
            required>
        </div>
      </div>

      <div class="input-group">
        <label for="password">Contraseña</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-lock input-icon"></i>
          <input
            id="password"
            type="password"
            name="password"
            [(ngModel)]="password"
            placeholder="••••••••"
            required>
        </div>
      </div>

      <button type="submit" class="btn-submit">
        <span>Iniciar Sesión</span>
        <i class="fa-solid fa-arrow-right-to-bracket"></i>
      </button>

    </form>

    <footer class="login-footer">
      <span>Sostenible</span> • <span>Responsable</span> • <span>Consciente</span>
    </footer>

  </section>
</main>
