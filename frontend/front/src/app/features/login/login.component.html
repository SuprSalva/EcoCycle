<main class="login-wrapper">

  <app-bar></app-bar>

  <div class="background-overlay"></div>

  <section class="login-card">
    
    <div class="login-header">
      <div class="logo-container">
        <img src="/logoo.png" alt="EcoCycle" class="logo-img">
        <h1 class="brand-name">EcoCycle</h1>
      </div>
      <p class="subtitle">Sistema de Gestión Sostenible</p>
    </div>

    <div class="encabezado-login">
      <h2>Iniciar Sesión</h2>
      <p>Accede al sistema de gestión EcoCycle</p>
    </div>

    
    <form class="login-form" (ngSubmit)="onLogin()">

      <div class="input-group">
        <label for="email">Correo Electrónico</label>
        <div class="input-wrapper">
          <i class="fa-regular fa-envelope input-icon"></i>
          <input
            id="email"
            type="email"
            name="email"
            [(ngModel)]="email"
            placeholder="ejemplo@ecocycle.com"
            required>
        </div>
      </div>

      <div class="input-group">
        <label for="password">Contraseña</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-lock input-icon"></i>
          <input
            id="password"
            type="password"
            name="password"
            [(ngModel)]="password"
            placeholder="••••••••"
            required>
        </div>
      </div>

      <div class="opciones-extra" style="text-align: right; margin-bottom: 15px; font-size: 0.9rem;">
        <a href="#" (click)="onForgotPassword($event)" style="color: #2b7a0b; text-decoration: none;">¿Olvidaste tu contraseña?</a>
      </div>

      <button type="submit">
        Iniciar Sesión
      </button>

    </form>

    <footer class="login-footer">
      <span>Sostenible</span> • <span>Responsable</span> • <span>Consciente</span>
    </footer>

  </section>
</main>
