<main class="contenedor-principal">
  <div class="tarjeta-login">
    
    <div class="header-logo">
      <img src="/logo_eco.png" alt="EcoCycle Logo" class="logo-img">
      <span class="logo-texto">EcoCycle</span>
    </div>

    <h1 class="titulo">Bienvenido a EcoCycle</h1>
    <p class="subtitulo">Ingresa tus credenciales para acceder al panel de administración.</p>

    <form class="formulario" (ngSubmit)="onLogin()">
  
  <div class="grupo-input">
    <label for="email">Correo Electrónico</label>
    <div class="input-icono-wrapper">
      <i class="fa-regular fa-envelope icono"></i>
      <input type="email" id="email" name="email" [(ngModel)]="email" placeholder="admin@ecocycle.com" required>
    </div>
  </div>

  <div class="grupo-input">
    <label for="password">Contraseña</label>
    <div class="input-icono-wrapper">
      <i class="fa-solid fa-lock icono"></i>
      <input type="password" id="password" name="password" [(ngModel)]="password" placeholder="••••••••" required>
    </div>
  </div>

  <button type="submit" class="btn-principal">
    <span>Iniciar Sesión</span>
    <i class="fa-solid fa-arrow-right"></i>
  </button>

</form>

  </div>
</main>
