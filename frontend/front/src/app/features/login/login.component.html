<main class="contenedor-principal">
  <div class="tarjeta-login">
    
    <div class="header-logo">
      <div class="logo-icono">
        <i class="fa-solid fa-leaf"></i>
      </div>
      <span class="logo-texto">EcoCycle</span>
    </div>

    <h1 class="titulo">¡Hola de nuevo!</h1>
    <p class="subtitulo">Interfaz limpia con campos de Email y Password. Integración con JWT para sesiones seguras y persistentes.</p>

    <form class="formulario" (ngSubmit)="onLogin()">
  
  <div class="grupo-input">
    <label for="email">Correo Electrónico</label>
    <div class="input-icono-wrapper">
      <i class="fa-regular fa-envelope icono"></i>
      <input type="email" id="email" name="email" [(ngModel)]="email" placeholder="michellegalcan@gmail.com" required>
    </div>
  </div>

  <div class="grupo-input">
    <label for="password">Contraseña</label>
    <div class="input-icono-wrapper">
      <i class="fa-solid fa-lock icono"></i>
      <input type="password" id="password" name="password" [(ngModel)]="password" placeholder="••••••••" required>
    </div>
  </div>

  <button type="submit" class="btn-principal">
    <span>Iniciar Sesión de Forma Segura</span>
    <i class="fa-solid fa-arrow-right"></i>
  </button>

</form>

    <div class="footer-tarjeta">
      ¿Nuevo en EcoCycle? <a routerLink="/registro">Crea una cuenta</a>
    </div>

  </div>
</main>
