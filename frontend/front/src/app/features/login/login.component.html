<main class="login-wrapper">

  <app-bar></app-bar>

  <div class="background-overlay"></div>

  <section class="login-card horizontal-card">
    
    <!-- Lado Izquierdo (Branding) -->
    <div class="login-card-left">
      <div class="branding-content">
        <div class="logo-container">
          <img src="/logoo_blanco.png" alt="EcoCycle" class="logo-img">
          <h1 class="brand-name">EcoCycle</h1>
        </div>
        <p class="subtitle">Sistema de Gestión Sostenible</p>
        
        <div class="eco-messaging">
          <p>Únete al cambio verde.</p>
          <p>Recicla, gana puntos y transforma tu huella en el planeta.</p>
        </div>
      </div>
    </div>

    <!-- Lado Derecho (Formulario) -->
    <div class="login-card-right">
      <div class="encabezado-login">
        <h2>Bienvenido de nuevo</h2>
        <p>Inicia sesión en tu cuenta EcoCycle</p>
      </div>

      <form class="login-form" (ngSubmit)="onLogin()">
        <div class="input-group">
          <label for="email">Correo Electrónico</label>
          <div class="input-wrapper">
            <i class="fa-regular fa-envelope input-icon"></i>
            <input
              id="email"
              type="email"
              name="email"
              [(ngModel)]="email"
              placeholder="ejemplo@ecocycle.com"
              required>
          </div>
        </div>

        <div class="input-group">
          <label for="password">Contraseña</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-lock input-icon"></i>
            <input
              id="password"
              type="password"
              name="password"
              [(ngModel)]="password"
              placeholder="••••••••"
              required>
          </div>
        </div>

        <div class="opciones-extra" style="text-align: right; margin-bottom: 15px; font-size: 0.9rem;">
          <a href="#" (click)="onForgotPassword($event)" style="color: #2b7a0b; text-decoration: none;">¿Olvidaste tu contraseña?</a>
        </div>

        <button type="submit" class="btn-submit">
          Iniciar Sesión
        </button>
      </form>

      <footer class="login-footer">
        <span>Sostenible</span> • <span>Responsable</span> • <span>Consciente</span>
      </footer>
    </div>

  </section>
</main>
