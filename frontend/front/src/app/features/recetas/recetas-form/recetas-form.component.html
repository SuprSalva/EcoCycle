<div class="container mt-4">
    <div class="card shadow-sm">
      <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
        <h4 class="mb-0">{{ isEdit ? 'Editar Receta' : 'Nueva Receta' }}</h4>
      </div>
      <div class="card-body">
        <form [formGroup]="form" (ngSubmit)="guardar()">
          <div class="row">
            
            <!-- ID Producto -->
            <div class="col-md-6 mb-3">
              <label class="form-label">ID del Producto <span class="text-danger">*</span></label>
              <input 
                type="text" 
                class="form-control" 
                formControlName="productoId"
                [ngClass]="{'is-invalid': form.get('productoId')?.touched && form.get('productoId')?.invalid}"
                placeholder="Ej: PROD-101"
              />
              <div class="invalid-feedback">El ID del producto es obligatorio.</div>
            </div>
  
            <!-- Nombre Producto -->
            <div class="col-md-6 mb-3">
              <label class="form-label">Nombre del Producto <span class="text-danger">*</span></label>
              <input 
                type="text" 
                class="form-control" 
                formControlName="nombreProducto"
                [ngClass]="{'is-invalid': form.get('nombreProducto')?.touched && form.get('nombreProducto')?.invalid}"
                placeholder="Ej: Café Capuchino 12oz"
              />
              <div class="invalid-feedback">El nombre del producto es obligatorio.</div>
            </div>
  
            <!-- Versión -->
            <div class="col-md-6 mb-3">
              <label class="form-label">Versión <span class="text-danger">*</span></label>
              <input 
                type="number" 
                class="form-control" 
                formControlName="version"
                [ngClass]="{'is-invalid': form.get('version')?.touched && form.get('version')?.invalid}"
              />
              <div class="invalid-feedback">La versión debe ser un número mayor o igual a 1.</div>
            </div>
  
            <!-- Tiempo Estimado en Minutos -->
            <div class="col-md-6 mb-3">
              <label class="form-label">Tiempo Estimado (minutos) <span class="text-danger">*</span></label>
              <input 
                type="number" 
                step="0.1"
                class="form-control" 
                formControlName="tiempoEstimadoMinutos"
                [ngClass]="{'is-invalid': form.get('tiempoEstimadoMinutos')?.touched && form.get('tiempoEstimadoMinutos')?.invalid}"
              />
              <div class="invalid-feedback">Ingresa un tiempo válido (mínimo 0).</div>
            </div>
  
            <!-- Descripción -->
            <div class="col-md-12 mb-3">
              <label class="form-label">Descripción</label>
              <textarea 
                class="form-control" 
                formControlName="descripcion" 
                rows="3"
                placeholder="Detalles sobre la preparación estándar de este producto..."
              ></textarea>
            </div>
  
            <!-- Estatus Activo -->
            <div class="col-md-12 mb-3">
              <div class="form-check form-switch">
                <input 
                  class="form-check-input" 
                  type="checkbox" 
                  id="activoSwitch"
                  formControlName="activo"
                />
                <label class="form-check-label" for="activoSwitch">Receta Activa</label>
              </div>
            </div>
  
          </div>
  
          <!-- Botones de Acción -->
          <div class="d-flex justify-content-end gap-2 mt-3">
            <a routerLink="/recetas" class="btn btn-secondary">Cancelar</a>
            <button type="submit" class="btn btn-primary" [disabled]="guardando">
              <span *ngIf="guardando" class="spinner-border spinner-border-sm me-1" role="status"></span>
              {{ isEdit ? 'Actualizar' : 'Guardar' }}
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
