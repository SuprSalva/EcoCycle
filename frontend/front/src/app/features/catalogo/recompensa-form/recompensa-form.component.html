<div class="card shadow-sm border-0 rounded-4 bg-white p-4 mx-auto" style="max-width: 800px;">
  
  <!-- Encabezado -->
  <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
    <div>
      <h2 class="fw-bold m-0" style="font-size: 1.5rem; color: var(--on-background-color) !important; letter-spacing: -0.02em;">
        {{ esEdicion ? 'Editar Recompensa' : 'Nueva Recompensa' }}
      </h2>
      <p class="text-muted small m-0 mt-1">
        Completa los datos para {{ esEdicion ? 'actualizar esta recompensa' : 'agregarla al catálogo' }}.
      </p>
    </div>
    <button type="button" class="btn btn-light rounded-circle shadow-sm d-flex justify-content-center align-items-center" 
            style="width: 40px; height: 40px;" (click)="volver()" title="Volver">
      <i class="fa-solid fa-xmark text-muted fs-5"></i>
    </button>
  </div>

  <!-- Formulario -->
  <form [formGroup]="recompensaForm" (ngSubmit)="guardarRecompensa()">
    
    <div class="row g-4">
      
      <!-- Nombre -->
      <div class="col-md-12">
        <label class="form-label fw-semibold text-secondary small mb-1">Nombre Comercial <span class="text-danger">*</span></label>
        <div class="input-group shadow-sm rounded-3">
          <span class="input-group-text bg-light border-end-0 text-muted px-3">
            <i class="fa-solid fa-gift"></i>
          </span>
          <input type="text" class="form-control border-start-0 ps-0 bg-light" formControlName="nombre" 
                 placeholder="Ej. Termo Ecológico" [ngClass]="{'is-invalid': recompensaForm.get('nombre')?.invalid && recompensaForm.get('nombre')?.touched}">
        </div>
      </div>

      <!-- Descripción -->
      <div class="col-md-12">
        <label class="form-label fw-semibold text-secondary small mb-1">Descripción de la recompensa <span class="text-danger">*</span></label>
        <div class="input-group shadow-sm rounded-3">
          <textarea class="form-control bg-light" formControlName="descripcion" rows="3"
                    placeholder="Describe los beneficios y características del premio..."
                    [ngClass]="{'is-invalid': recompensaForm.get('descripcion')?.invalid && recompensaForm.get('descripcion')?.touched}"></textarea>
        </div>
      </div>

      <!-- Costo Puntos -->
      <div class="col-md-6">
        <label class="form-label fw-semibold text-secondary small mb-1">Costo en EcoPts <span class="text-danger">*</span></label>
        <div class="input-group shadow-sm rounded-3">
          <span class="input-group-text bg-light border-end-0 text-muted px-3">
            <i class="fa-solid fa-coins"></i>
          </span>
          <input type="number" class="form-control border-start-0 ps-0 bg-light" formControlName="costoPuntos" 
                 placeholder="Ej. 150" [ngClass]="{'is-invalid': recompensaForm.get('costoPuntos')?.invalid && recompensaForm.get('costoPuntos')?.touched}">
        </div>
      </div>

      <!-- Stock -->
      <div class="col-md-6">
        <label class="form-label fw-semibold text-secondary small mb-1">Existencia / Stock <span class="text-danger">*</span></label>
        <div class="input-group shadow-sm rounded-3">
          <span class="input-group-text bg-light border-end-0 text-muted px-3">
            <i class="fa-solid fa-boxes-stacked"></i>
          </span>
          <input type="number" class="form-control border-start-0 ps-0 bg-light" formControlName="stock" 
                 placeholder="Ej. 50 (-1 para ilimitado)" [ngClass]="{'is-invalid': recompensaForm.get('stock')?.invalid && recompensaForm.get('stock')?.touched}">
        </div>
      </div>

      <!-- Foto / Imagen -->
      <div class="col-md-12">
        <label class="form-label fw-semibold text-secondary small mb-1">Foto de la Recompensa</label>
        
        <div class="d-flex align-items-center gap-3 p-3 bg-light rounded-3 shadow-sm border border-light">
          <!-- Preview -->
          <div class="position-relative d-flex justify-content-center align-items-center bg-white rounded-3 shadow-sm border" 
               style="width: 80px; height: 80px; overflow: hidden; flex-shrink: 0;">
            <img *ngIf="imagenPreviewUrl" [src]="imagenPreviewUrl" alt="Preview" style="width: 100%; height: 100%; object-fit: cover;">
            <i *ngIf="!imagenPreviewUrl" class="fa-solid fa-image text-muted fs-3"></i>
          </div>
          
          <!-- Input File -->
          <div class="flex-grow-1">
            <input type="file" class="form-control bg-white" accept="image/*" (change)="alSeleccionarArchivo($event)">
            <small class="text-muted mt-1 d-block">Selecciona una imagen de tu computadora (JPG, PNG).</small>
          </div>
        </div>
      </div>

      <!-- Estado Activa -->
      <div class="col-md-12 mt-4" *ngIf="esEdicion">
        <div class="form-check form-switch d-flex align-items-center gap-2">
          <input class="form-check-input" type="checkbox" role="switch" id="activaSwitch" formControlName="activa" style="transform: scale(1.3); cursor: pointer;">
          <label class="form-check-label fw-semibold" for="activaSwitch" 
                 [ngStyle]="{'color': recompensaForm.get('activa')?.value ? '#137333' : '#c5221f'}">
            {{ recompensaForm.get('activa')?.value ? 'Recompensa Activa en el Catálogo' : 'Recompensa Oculta/Inactiva' }}
          </label>
        </div>
      </div>

    </div>

    <!-- Acciones -->
    <div class="d-flex justify-content-end gap-3 mt-5 pt-3 border-top">
      <button type="button" class="btn btn-light px-4 py-2 fw-semibold rounded-3 shadow-sm" (click)="volver()" [disabled]="cargando">
        Cancelar
      </button>
      
      <button type="submit" class="btn text-white px-4 py-2 fw-semibold rounded-3 shadow-sm d-flex align-items-center gap-2" 
              style="background-color: var(--primary-color);" [disabled]="cargando">
        <span *ngIf="cargando" class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
        <i class="fa-solid fa-save" *ngIf="!cargando"></i>
        {{ esEdicion ? 'Guardar Cambios' : 'Crear Recompensa' }}
      </button>
    </div>

  </form>
</div>
