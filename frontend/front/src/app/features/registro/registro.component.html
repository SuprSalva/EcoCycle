<main class="contenedor-principal">
  <div class="tarjeta-registro">
    
    <div class="header-logo">
      <img src="/logos.png" alt="EcoCycle Logo" class="logo-img">
      <span class="logo-texto">EcoCycle</span>
    </div>

    <h1 class="titulo">Crear una cuenta</h1>
    <p class="subtitulo">Únete a EcoCycle y gestiona tus residuos de manera eficiente y sostenible.</p>

   <form class="formulario" (ngSubmit)="onRegistro()">
      
  <div class="grupo-input">
    <label for="nombre">Nombre Completo</label>
    <div class="input-icono-wrapper">
      <i class="fa-regular fa-user icono"></i>
      <input type="text" id="nombre" name="nombre" [(ngModel)]="nombre" placeholder="Juan Pérez" required>
    </div>
  </div>

  <div class="grupo-input">
    <label for="email">Correo Electrónico</label>
    <div class="input-icono-wrapper">
      <i class="fa-regular fa-envelope icono"></i>
      <input type="email" id="email" name="email" [(ngModel)]="email" placeholder="juan.perez@email.com" required>
    </div>
  </div>

  <div class="grupo-input">
    <label for="password">Contraseña</label>
    <div class="input-icono-wrapper">
      <i class="fa-solid fa-lock icono"></i>
      <input type="password" id="password" name="password" [(ngModel)]="password" placeholder="••••••••••••" required>
    </div>
  </div>

  <button type="submit" class="btn-principal">
    <span>Registrarse</span>
    <i class="fa-solid fa-user-plus"></i>
  </button>

</form>
    <div class="registro-imagen-footer">
      <img src="/registro_footer.png" alt="EcoCycle Footer" style="width: 100%; border-radius: 12px; margin-top: 15px;">
    </div>
    <div class="footer-tarjeta">
      ¿Ya tienes una cuenta? <a routerLink="/login">Inicia Sesión</a>
    </div>

  </div>
</main>
