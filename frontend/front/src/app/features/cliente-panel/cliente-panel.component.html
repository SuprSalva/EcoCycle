<div class="container-fluid min-vh-100" style="background-color: var(--background-color);">

  <!-- ENCABEZADO -->
  <div class="d-flex align-items-center gap-3 mb-4 px-2">

    <div
      class="d-flex align-items-center justify-content-center rounded-circle shadow-sm"
      style="width:52px;
             height:52px;
             background-color:var(--primary-container-color);
             color:#0D631B;">

      <i class="fa-solid fa-user-gear fs-5"></i>

    </div>

    <div>

      <h2 class="fw-bold m-0"
          style="font-size:1.75rem;
                 color:var(--on-background-color);
                 letter-spacing:-0.02em;">

        Mi Perfil

      </h2>

      <p class="text-muted small m-0 mt-1"
         style="font-size:.9rem;">

        Actualiza tu información personal y de seguridad.

      </p>

    </div>

  </div>

  <div *ngIf="!cargando" class="row g-4">

    <!-- ================= DATOS PERSONALES ================= -->

    <div class="col-lg-7">

      <div class="card shadow-sm border-0 rounded-4 overflow-hidden p-4 h-100"
           style="background-color:var(--surface-color);">

        <h5 class="fw-bold mb-4"
            style="color:var(--on-surface-color);">

          Datos Personales

        </h5>

        <form
          [formGroup]="perfilForm"
          (ngSubmit)="actualizarPerfil()">

          <div class="row g-4">

            <!-- Nombre -->

            <div class="col-md-6">

              <label
                class="form-label fw-bold mb-1"
                style="color:var(--on-surface-color);
                       font-size:.85rem;
                       letter-spacing:.03em;">

                NOMBRE

              </label>

              <div class="input-group">

                <span class="input-group-text border-end-0 rounded-start-3"
                      style="background:var(--surface-variant-color);
                             border:1px solid var(--surface-variant-color);">

                  <span class="material-symbols-outlined">
                    person
                  </span>

                </span>

                <input
                  type="text"
                  formControlName="nombre"
                  class="form-control rounded-end-3 border-start-0 px-3 py-2 shadow-none"
                  style="border:1px solid var(--surface-variant-color);
                         background:var(--background-color);">

              </div>

            </div>

            <!-- Apellidos -->

            <div class="col-md-6">

              <label
                class="form-label fw-bold mb-1"
                style="color:var(--on-surface-color);
                       font-size:.85rem;
                       letter-spacing:.03em;">

                APELLIDOS

              </label>

              <input
                type="text"
                formControlName="apellidos"
                class="form-control rounded-3 px-3 py-2 shadow-none"
                style="border:1px solid var(--surface-variant-color);
                       background:var(--background-color);">

            </div>

            <!-- Teléfono -->

            <div class="col-md-12">

              <label
                class="form-label fw-bold mb-1"
                style="color:var(--on-surface-color);
                       font-size:.85rem;
                       letter-spacing:.03em;">

                TELÉFONO

              </label>

              <div class="input-group">

                <span class="input-group-text border-end-0 rounded-start-3"
                      style="background:var(--surface-variant-color);
                             border:1px solid var(--surface-variant-color);">

                  <span class="material-symbols-outlined">
                    call
                  </span>

                </span>

                <input
                  type="text"
                  formControlName="telefono"
                  class="form-control rounded-end-3 border-start-0 px-3 py-2 shadow-none"
                  style="border:1px solid var(--surface-variant-color);
                         background:var(--background-color);">

              </div>

            </div>

            <!-- Dirección -->

            <div class="col-md-12">

              <label
                class="form-label fw-bold mb-1"
                style="color:var(--on-surface-color);
                       font-size:.85rem;
                       letter-spacing:.03em;">

                DIRECCIÓN

              </label>

              <div class="input-group">

                <span class="input-group-text border-end-0 rounded-start-3"
                      style="background:var(--surface-variant-color);
                             border:1px solid var(--surface-variant-color);">

                  <span class="material-symbols-outlined">
                    location_on
                  </span>

                </span>

                <input
                  type="text"
                  formControlName="direccion"
                  class="form-control rounded-end-3 border-start-0 px-3 py-2 shadow-none"
                  style="border:1px solid var(--surface-variant-color);
                         background:var(--background-color);">

              </div>

            </div>

          </div>

          <div class="d-flex justify-content-end mt-5 pt-3 border-top"
               style="border-top:1px solid var(--surface-variant-color)!important;">

            <button
              type="submit"
              class="btn d-flex align-items-center gap-2 px-4 py-2 rounded-3 fw-semibold border-0 shadow-sm"
              style="background:#0D631B;color:white;"
              [disabled]="perfilForm.invalid">

              <span class="material-symbols-outlined">
                check_circle
              </span>

              Guardar Cambios

            </button>

          </div>

        </form>

      </div>

    </div>

    <!-- ================= CONTRASEÑA ================= -->

    <div class="col-lg-5">

      <div class="card shadow-sm border-0 rounded-4 overflow-hidden p-4 h-100"
           style="background-color:var(--surface-color);">

        <h5 class="fw-bold mb-4"
            style="color:var(--on-surface-color);">

          Cambiar Contraseña

        </h5>

        <form
          [formGroup]="passwordForm"
          (ngSubmit)="cambiarPassword()">

          <div class="row g-4">

            <div class="col-12">

              <label
                class="form-label fw-bold mb-1"
                style="color:var(--on-surface-color);
                       font-size:.85rem;
                       letter-spacing:.03em;">

                NUEVA CONTRASEÑA

              </label>

              <div class="input-group">

                <span class="input-group-text border-end-0 rounded-start-3"
                      style="background:var(--surface-variant-color);
                             border:1px solid var(--surface-variant-color);">

                  <span class="material-symbols-outlined">
                    lock
                  </span>

                </span>

                <input
                  type="password"
                  formControlName="password"
                  class="form-control rounded-end-3 border-start-0 px-3 py-2 shadow-none"
                  style="border:1px solid var(--surface-variant-color);
                         background:var(--background-color);">

              </div>

            </div>

            <div class="col-12">

              <label
                class="form-label fw-bold mb-1"
                style="color:var(--on-surface-color);
                       font-size:.85rem;
                       letter-spacing:.03em;">

                CONFIRMAR CONTRASEÑA

              </label>

              <div class="input-group">

                <span class="input-group-text border-end-0 rounded-start-3"
                      style="background:var(--surface-variant-color);
                             border:1px solid var(--surface-variant-color);">

                  <span class="material-symbols-outlined">
                    enhanced_encryption
                  </span>

                </span>

                <input
                  type="password"
                  formControlName="confirmar"
                  class="form-control rounded-end-3 border-start-0 px-3 py-2 shadow-none"
                  style="border:1px solid var(--surface-variant-color);
                         background:var(--background-color);">

              </div>

            </div>

          </div>

          <div class="alert alert-info d-flex align-items-center gap-3 p-3 rounded-3 mt-4"
               style="background:#e8f4fd;border:1px solid #b8d4e8;">

            <span class="material-symbols-outlined fs-3"
                  style="color:#0D631B;">

              info

            </span>

            <div>

              <strong style="color:#0D631B;">
                Seguridad
              </strong>

              <p class="mb-0 small text-muted">
                Utiliza una contraseña segura con al menos 8 caracteres.
              </p>

            </div>

          </div>

          <div class="d-flex justify-content-end mt-5 pt-3 border-top"
               style="border-top:1px solid var(--surface-variant-color)!important;">

            <button
              type="submit"
              class="btn d-flex align-items-center gap-2 px-4 py-2 rounded-3 fw-semibold border-0 shadow-sm"
              style="background:#0D631B;color:white;"
              [disabled]="passwordForm.invalid">

              <span class="material-symbols-outlined">
                lock_reset
              </span>

              Actualizar Contraseña

            </button>

          </div>

        </form>

      </div>

    </div>

  </div>

</div>
