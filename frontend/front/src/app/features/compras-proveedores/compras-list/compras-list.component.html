<div class="container-fluid py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="mb-0 text-primary fw-bold">Historial de Compras</h2>
    <a routerLink="/panel/compras-proveedores/nueva" class="btn btn-success shadow-sm">
      <i class="bi bi-cart-plus me-2"></i>Registrar Compra
    </a>
  </div>

  <div class="card shadow-sm border-0 rounded-4">
    <div class="card-body p-4">
      
      <div *ngIf="cargando" class="text-center py-5">
        <div class="spinner-border text-success" role="status">
          <span class="visually-hidden">Cargando...</span>
        </div>
      </div>

      <div *ngIf="!cargando && compras.length === 0" class="text-center py-5 text-muted">
        <i class="bi bi-bag-x display-1"></i>
        <p class="mt-3 fs-5">No hay compras registradas aún.</p>
      </div>

      <div class="table-responsive" *ngIf="!cargando && compras.length > 0">
        <table class="table table-hover align-middle">
          <thead class="table-light">
            <tr>
              <th>Proveedor</th>
              <th>Fecha</th>
              <th>Estado</th>
              <th>Total</th>
              <th class="text-center">Acciones</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let c of compras">
              <td class="fw-medium">
                <i class="bi bi-building me-2 text-secondary"></i>
                {{ c.proveedorNombre }}
              </td>
              <td>{{ c.fechaCompra | date:'medium' }}</td>
              <td>
                <span class="badge bg-success rounded-pill" *ngIf="c.estado === 'Completado'">{{ c.estado }}</span>
                <span class="badge bg-warning text-dark rounded-pill" *ngIf="c.estado !== 'Completado'">{{ c.estado }}</span>
              </td>
              <td class="fw-bold text-success">${{ c.total | number:'1.2-2' }}</td>
              <td class="text-center">
                <button (click)="verDetalles(c)" class="btn btn-sm btn-outline-info rounded-pill px-3">
                  <i class="bi bi-eye me-1"></i> Ver Detalles
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

    </div>
  </div>
</div>
