<div class="container-fluid py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="mb-0 text-primary fw-bold">Administración de Proveedores</h2>
    <a routerLink="/panel/proveedores/nuevo" class="btn btn-success shadow-sm">
      <i class="bi bi-plus-circle me-2"></i>Nuevo Proveedor
    </a>
  </div>

  <div class="card shadow-sm border-0 rounded-4">
    <div class="card-body p-4">
      
      <div *ngIf="cargando" class="text-center py-5">
        <div class="spinner-border text-success" role="status">
          <span class="visually-hidden">Cargando...</span>
        </div>
      </div>

      <div *ngIf="!cargando && proveedores.length === 0" class="text-center py-5 text-muted">
        <i class="bi bi-inboxes display-1"></i>
        <p class="mt-3 fs-5">No hay proveedores registrados aún.</p>
      </div>

      <div class="table-responsive" *ngIf="!cargando && proveedores.length > 0">
        <table class="table table-hover align-middle">
          <thead class="table-light">
            <tr>
              <th>Nombre</th>
              <th>Empresa</th>
              <th>Teléfono</th>
              <th>Email</th>
              <th class="text-center">Acciones</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let p of proveedores">
              <td class="fw-medium">{{ p.nombre }}</td>
              <td><span class="badge bg-info text-dark rounded-pill">{{ p.empresa }}</span></td>
              <td><i class="bi bi-telephone text-muted me-2"></i>{{ p.telefono }}</td>
              <td><i class="bi bi-envelope text-muted me-2"></i>{{ p.email }}</td>
              <td class="text-center">
                <button [routerLink]="['/panel/proveedores/editar', p.id]" class="btn btn-sm btn-outline-primary me-2 rounded-circle" title="Editar">
                  <i class="bi bi-pencil"></i>
                </button>
                <button (click)="eliminarProveedor(p.id)" class="btn btn-sm btn-outline-danger rounded-circle" title="Eliminar">
                  <i class="bi bi-trash"></i>
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

    </div>
  </div>
</div>
