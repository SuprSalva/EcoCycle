<div class="container-fluid p-4 min-vh-100" style="background-color: var(--background-color);">
  <div class="fade-in-up">
    <!-- Encabezado -->
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-3 px-2">
      <div>
        <h2 class="fw-bold m-0" style="font-size: 1.75rem; color: var(--text) !important; letter-spacing: -0.02em;">
          Centro de Notificaciones
        </h2>
        <p class="text-muted small m-0 mt-1" style="font-size: 0.9rem;">
          Mantente al tanto de la actividad en tu sistema EcoCycle.
        </p>
      </div>

      <div class="d-flex flex-wrap gap-2 align-items-center">
        <button class="btn btn-outline-secondary btn-sm fw-semibold shadow-sm d-flex align-items-center gap-2" 
                (click)="marcarTodasComoLeidas()">
          <i class="fa-solid fa-check-double"></i> Marcar todas como leídas
        </button>
      </div>
    </div>

    <!-- Lista de Notificaciones -->
    <div class="card shadow-sm border-0 rounded-4 card-modern p-3 mb-4 position-relative">
      
      <!-- Loader -->
      <div *ngIf="cargando" class="text-center py-5">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Cargando...</span>
        </div>
        <p class="text-muted mt-2 small">Cargando notificaciones...</p>
      </div>

      <div class="list-group list-group-flush" *ngIf="!cargando">
        <div *ngFor="let notif of notificaciones" 
             class="list-group-item border-bottom-0 rounded-3 mb-2 p-3 notification-card"
             [ngClass]="notif.leida ? 'bg-transparent border' : 'bg-light border-0'">
          <div class="d-flex align-items-start gap-3">
            <div class="icon-circle shadow-sm bg-white" style="width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
              <i [class]="getIcono(notif.icono)" style="font-size: 1.1rem;"></i>
            </div>
            <div class="flex-grow-1">
              <div class="d-flex justify-content-between align-items-center mb-1">
                <h6 class="fw-bold m-0 text-dark">{{ notif.titulo }}</h6>
                <small class="text-muted fw-semibold" style="font-size: 0.75rem;">{{ formatearFecha(notif.fecha) }}</small>
              </div>
              <p class="text-muted m-0 small">{{ notif.descripcion }}</p>
            </div>
            <div class="d-flex align-items-center justify-content-center" style="width: 15px;">
              <div *ngIf="!notif.leida" class="bg-primary rounded-circle" style="width: 8px; height: 8px;"></div>
            </div>
          </div>
        </div>

        <div *ngIf="notificaciones.length === 0 && !cargando" class="text-center py-5">
          <i class="fa-regular fa-bell-slash text-muted fs-1 mb-3" style="opacity: 0.3;"></i>
          <h5 class="fw-bold text-secondary">No tienes notificaciones</h5>
          <p class="text-muted small">Tus alertas y avisos recientes aparecerán aquí.</p>
        </div>
      </div>
    </div>
  </div>
</div>
