
# Compose de DESARROLLO (hot-reload). Para producción usar ../docker-compose.prod.yml
services:
  backend:
    image: mcr.microsoft.com/dotnet/sdk:8.0
    container_name: ecocycle_backend
    working_dir: /app
    volumes:
      - ./backend/Back:/app
    command: dotnet watch run --urls "http://0.0.0.0:5000"
    ports:
      - "5000:5000"
    env_file: ../ecocycle.env
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/app/firebase-key.json
      - Email__SmtpPassword=${SMTP_PASSWORD:-}

  frontend:
   image: node:20
   container_name: ecocycle_frontend
   working_dir: /app
   volumes:
     - ./frontend/front:/app
     - /app/node_modules
   command: sh -c "npm install && npm start -- --host 0.0.0.0"
   ports:
     - "4200:4200"
   depends_on:
     - backend